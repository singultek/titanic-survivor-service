[build-system]
requires = [
    "setuptools>=69.0.0",
    "wheel>=0.42.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-classification-model"
description = "A Package of Titanic classification model with the original dataset."
authors = [{name = "Sinan Gültekin", email = "singultek@gmail.com"}]
requires-python = "==3.11.1"
dynamic = ["version"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "scikit-learn==1.4.1.post1",
    "numpy==1.26.4",
    "scipy==1.12.0",
    "joblib==1.3.2",
    "pandas==2.2.0",
    "pyarrow==15.0.0",
    "pydantic==2.6.1",
    "pyyaml==6.0.1",
    "feature_engine==1.6.2",
]

[dependency-groups]
dev = ["pytest==8.0.2"]

[tool.setuptools.dynamic]
version = {file = "classification_model/VERSION"}

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
classification_model = ["VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests", "integration"]
addopts = "-v -ra -q"
log_cli = true
log_cli_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
minversion = "6.0"
filterwarnings = "ignore"
norecursedirs = ["docs", "build"]
# Specify a custom directory for pytest cache
cache_dir = ".pytest_cache"

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
lines_between_sections = 1
skip = "migrations"
