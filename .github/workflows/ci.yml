name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --frozen

      - name: Run model-package tests
        run: uv run pytest model-package/tests

      - name: Run app tests
        run: uv run pytest titanic-survivor-app/app/tests

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t titanic-survivor-service:ci -f Dockerfile .

      - name: Run container
        run: docker run -d -p 8001:8001 --name ci-smoke titanic-survivor-service:ci

      - name: Wait for service to be ready
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8001/ && break
            sleep 2
          done

      - name: Smoke test endpoints
        run: |
          curl -sf http://localhost:8001/ > /dev/null
          curl -sf http://localhost:8001/api/v1/health
          curl -sf -X POST http://localhost:8001/api/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"inputs":[{"sex":"male","age":25.0,"fare":170.0,"cabin":"B5","embarked":"S","title":"Mr"}]}'

      - name: Tear down container
        if: always()
        run: docker rm -f ci-smoke

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: docker
    # Only publish on an actual push: a release tag, or a merge to develop/main. Never for open PRs.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:7}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:latest,$IMAGE:$VERSION,$IMAGE:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "kind=main" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:main,$IMAGE:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "kind=staging" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:staging,$IMAGE:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      # Release tags are immutable: if this version was already published (e.g. a rerun,
      # or a tag re-pushed by mistake), skip rather than silently overwriting it.
      - name: Check if this release is already published
        id: skip_check
        if: steps.tags.outputs.kind == 'release'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists in GHCR - skipping publish to avoid overwriting an immutable release tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.skip_check.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Idempotent: if this tag's release already exists (e.g. a rerun), skip
      # rather than failing - `gh release create` errors on a duplicate tag.
      - name: Create release if it doesn't already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
