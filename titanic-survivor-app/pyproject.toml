[build-system]
requires = [
    "setuptools>=69.0.0",
    "wheel>=0.42.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-survivor-app"
version = "1.1.1"
description = "FastAPI service providing Titanic survival predictions."
requires-python = "==3.11.1"
dependencies = [
    "uvicorn==0.27.1",
    "fastapi==0.110.0",
    "python-multipart==0.0.9",
    "pydantic==2.6.1",
    "feature_engine==1.6.2",
    "requests==2.31.0",
    "pydantic-settings==2.2.1",
    "httpx==0.27.0",
    "titanic-classification-model",
]

[dependency-groups]
dev = ["pytest==8.0.2"]

[tool.uv.sources]
titanic-classification-model = { workspace = true }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "integration"]
addopts = "-v -ra -q"
log_cli = true
log_cli_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
minversion = "6.0"
filterwarnings = "ignore"
norecursedirs = ["docs", "build"]
# Specify a custom directory for pytest cache
cache_dir = ".pytest_cache"

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
lines_between_sections = 1
skip = "migrations"
